version: '3.8'

services:
  web:
    build: .
    container_name: hmis_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://hmis_user:hmis_password@db:5432/hmis_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-production-key-change-this
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: hmis_postgres
    restart: always
    environment:
      POSTGRES_USER: hmis_user
      POSTGRES_PASSWORD: hmis_password
      POSTGRES_DB: hmis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmis_user -d hmis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hmis_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
