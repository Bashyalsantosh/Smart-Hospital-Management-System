name: "Security, Integration Tests & Terraform CI/CD"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout repository code
  pull-requests: write # Required to post Terraform plan outputs on PRs

jobs:
  # ==========================================
  # JOB 1: Integration & Multi-Tenant Tests
  # ==========================================
  test:
    name: "Run Pytest Integration Tests"
    runs-on: ubuntu-latest

    # Service container for PostgreSQL integration testing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: hmis_user
          POSTGRES_PASSWORD: hmis_password
          POSTGRES_DB: hmis_test_db
        ports:
          - 5432:5432
        # Health check to ensure Postgres is ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; else pip install -r requirements.txt pytest pytest-asyncio httpx testcontainers; fi

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://hmis_user:hmis_password@localhost:5432/hmis_test_db"
          ENVIRONMENT: "testing"
        run: |
          pytest tests/ -v --junitxml=pytest-report.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-report.xml

  # ==========================================
  # JOB 2: Infrastructure as Code (Terraform)
  # ==========================================
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    needs: [test] # CRITICAL: Terraform execution requires 'test' job to succeed first
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Terraform Apply (Main Branch Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false tfplan
